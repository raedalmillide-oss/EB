<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Bridges Sourcing & Logistics Co.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --eb-black-dark: #08080a;
            --eb-black-card: #131317;
            --eb-gold-main: #c5a059;
            --eb-gold-light: #f5d78e;
            --eb-gold-dark: #987838;
        }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .luxury-gradient {
            background: linear-gradient(135deg, #09090b 0%, #17171c 50%, #0d0d10 100%);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d8b262 0%, #b89142 100%);
            color: #08080a;
            font-weight: 800;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e4c276 0%, #c8a152 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-backdrop {
            background-color: rgba(8, 8, 10, 0.75);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none">

    <div id="toast-container" class="fixed bottom-6 left-6 z-[250] space-y-3 pointer-events-none"></div>

    <header class="luxury-gradient text-white border-b-2 border-[#c5a059] sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3.5 cursor-pointer" onclick="navigateTo('dashboard')">
                <div class="w-12 h-12 rounded-2xl bg-black/60 border border-[#c5a059]/60 flex items-center justify-center text-[#f5d78e] shadow-md shadow-amber-950/20">
                    <i class="fa-solid fa-bridge text-2xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#f5d78e] font-serif">Echo Bridges</h1>
                        <span id="user-role-badge" class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-[#c5a059] text-black uppercase tracking-wider">Admin</span>
                    </div>
                    <p class="text-xs text-slate-300 font-medium tracking-wide">Sourcing & Logistics Co.</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex bg-black/50 border border-[#c5a059]/40 rounded-xl p-1 text-xs font-bold">
                    <button type="button" onclick="setLanguage('ar')" id="lang-btn-ar" class="px-2.5 py-1 rounded-lg transition">عربي</button>
                    <button type="button" onclick="setLanguage('en')" id="lang-btn-en" class="px-2.5 py-1 rounded-lg transition">EN</button>
                    <button type="button" onclick="setLanguage('zh')" id="lang-btn-zh" class="px-2.5 py-1 rounded-lg transition">中文</button>
                </div>

                <div class="flex items-center gap-2">
                    <span id="header-user-name" class="text-xs font-bold text-slate-300 hidden sm:inline-block"></span>
                    <button type="button" onclick="openAdminSettingsModal()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="تعديل حسابي">
                        <i class="fa-solid fa-user-gear"></i>
                    </button>
                    <button type="button" onclick="handleLogout()" class="bg-rose-500/20 hover:bg-rose-600 hover:text-white text-rose-300 border border-rose-500/30 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span id="t-logout">خروج</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="bg-[#121216] border-t border-slate-800">
            <div class="max-w-7xl mx-auto px-4 flex items-center gap-1.5 overflow-x-auto py-2 custom-scrollbar">
                <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-chart-pie"></i> <span id="t-nav-dashboard">لوحة التحكم</span>
                </button>
                <button onclick="navigateTo('clients')" id="nav-clients" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-users"></i> <span id="t-nav-clients">إدارة العملاء</span>
                </button>
                <button onclick="navigateTo('requests')" id="nav-requests" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-clipboard-list"></i> <span id="t-nav-requests">طلب التسعير</span>
                </button>
                <button onclick="navigateTo('inspections')" id="nav-inspections" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-clipboard-check"></i> <span id="t-nav-inspections">الفحص</span>
                </button>
                <button onclick="navigateTo('shipping')" id="nav-shipping" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-ship"></i> <span id="t-nav-shipping">الشحن</span>
                </button>
                <button onclick="navigateTo('suppliers')" id="nav-suppliers" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-industry"></i> <span id="t-nav-suppliers">دليل الموردين</span>
                </button>
                <button onclick="navigateTo('accounting')" id="nav-accounting" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-chart-line"></i> <span id="t-nav-accounting">التحليل المالي</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
        <section id="view-dashboard" class="space-y-6 hidden">
            <!-- داشبورد ومحتوى النظام -->
        </section>
        <!-- باقي الأقسام -->
    </main>

    <!-- 1. LOGIN MODAL -->
    <div id="modal-login" class="fixed inset-0 modal-backdrop z-[200] flex items-center justify-center p-4">
        <div class="luxury-gradient border border-[#c5a059]/40 rounded-3xl max-w-md w-full p-8 shadow-2xl text-white space-y-6">
            <div class="text-center space-y-2">
                <div class="mx-auto w-16 h-16 rounded-2xl bg-black/60 border border-[#c5a059]/40 text-[#f5d78e] flex items-center justify-center text-3xl mb-1 shadow-lg">
                    <i class="fa-solid fa-bridge"></i>
                </div>
                <h2 class="text-2xl font-black text-[#f5d78e] font-serif">Echo Bridges</h2>
                <p class="text-xs text-slate-400 font-medium">نظام إدارة التجارة والشحن الدولي الشامل</p>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المستخدم:</label>
                    <input type="text" id="login-username" required class="w-full p-3 bg-black/50 border border-slate-700 rounded-xl text-sm text-white focus:border-[#c5a059] outline-none" placeholder="raidalmelli">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور:</label>
                    <input type="password" id="login-password" required class="w-full p-3 bg-black/50 border border-slate-700 rounded-xl text-sm text-white focus:border-[#c5a059] outline-none" placeholder="Haitham2007@">
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                        <input type="checkbox" id="remember-me-checkbox" class="w-4 h-4 rounded text-[#c5a059] focus:ring-0">
                        <span>تذكر بيانات الدخول على هذا الجهاز</span>
                    </label>
                </div>

                <button type="submit" class="w-full btn-gold py-3.5 rounded-xl text-sm font-black shadow-xl transition">
                    تسجيل الدخول
                </button>

                <!-- زر الطوارئ لضبط بيانات الإدارة واجتياز أي مشكلة كلمة مرور -->
                <div class="pt-2 border-t border-slate-800 text-center">
                    <button type="button" onclick="hardResetAdminCredentials()" class="text-[11px] text-amber-400/80 hover:text-amber-300 underline font-bold transition">
                        <i class="fa-solid fa-rotate-right ml-1"></i> نسيت كلمة المرور؟ (إعادة تعيين كلمة السر الافتراضية)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة إعدادات الإدارة -->
    <div id="modal-admin-settings" class="fixed inset-0 modal-backdrop z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-black text-slate-900 text-base">إعدادات الحساب الشخصي للإدارة</h3>
                <button type="button" onclick="closeAdminSettingsModal()" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveAdminCredentials(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">اسم المستخدم الجديد للإدارة:</label>
                    <input type="text" id="admin-new-user" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" dir="ltr">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">كلمة المرور الجديدة:</label>
                    <input type="text" id="admin-new-pass" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" dir="ltr">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeAdminSettingsModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl">إلغاء</button>
                    <button type="submit" class="btn-gold px-5 py-2 rounded-xl font-black">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- بقية المودالز والنوافذ المنبثقة -->
    <div id="modal-client" class="fixed inset-0 modal-backdrop z-[150] hidden items-center justify-center p-4"></div>
    <div id="modal-request" class="fixed inset-0 modal-backdrop z-[150] hidden items-center justify-center p-4"></div>
    <div id="modal-inspection" class="fixed inset-0 modal-backdrop z-[150] hidden items-center justify-center p-4"></div>
    <div id="modal-shipping" class="fixed inset-0 modal-backdrop z-[150] hidden items-center justify-center p-4"></div>
    <div id="modal-supplier" class="fixed inset-0 modal-backdrop z-[150] hidden items-center justify-center p-4"></div>
    <div id="modal-quote" class="fixed inset-0 modal-backdrop z-[160] hidden items-center justify-center p-4"></div>
    <div id="modal-client-account" class="fixed inset-0 modal-backdrop z-[160] hidden items-center justify-center p-4"></div>
    <div id="modal-supplier-account" class="fixed inset-0 modal-backdrop z-[160] hidden items-center justify-center p-4"></div>
    <div id="modal-staff" class="fixed inset-0 modal-backdrop z-[160] hidden items-center justify-center p-4"></div>

    <script>
        const STORAGE_KEY = 'EB_LOGISTICS_DB_V15';
        const LOGIN_KEY = 'EB_REMEMBERED_USER';

        const SUPABASE_URL = 'https://zkzpxaqffrctjhfgkpnm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xi7Owac1858P4KUmIt-YCw_wWcy2XyC';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentLang = 'ar';
        let currentUser = null;
        let activeTab = 'dashboard';
        let selectedClientProfileId = null;
        let appDb = null;

        const defaultDatabase = {
            companyEmail: 'info@echobridges.com',
            adminUsername: 'raidalmelli',
            adminPassword: 'Haitham2007@',
            emailLog: [],
            exchangeRates: { usdToCny: 7.23, eurToUsd: 1.08 },
            clientCounter: 1000,
            staff: [],
            clients: [],
            suppliers: [],
            requests: [],
            inspections: [],
            shipping: []
        };

        function setLanguage(lang) {
            currentLang = lang || 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
            if (currentUser) renderCurrentView();
        }

        function loadLocalDb() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) appDb = JSON.parse(stored);
            } catch(e) {}
            
            if (!appDb) appDb = JSON.parse(JSON.stringify(defaultDatabase));
            
            // فرض القيم الافتراضية للإدارة دائماً لتجنب أي قفل في الدخول
            appDb.adminUsername = 'raidalmelli';
            appDb.adminPassword = 'Haitham2007@';
        }

        async function syncCloudDb() {
            try {
                const { data, error } = await supabase
                    .from('app_storage')
                    .select('value')
                    .eq('key', STORAGE_KEY)
                    .single();

                if (data && data.value) {
                    appDb = data.value;
                    appDb.adminUsername = 'raidalmelli';
                    appDb.adminPassword = 'Haitham2007@';
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appDb)); 
                    if (currentUser) renderCurrentView(); 
                }
            } catch (err) {}
        }

        async function persistDb() {
            appDb.adminUsername = 'raidalmelli';
            appDb.adminPassword = 'Haitham2007@';
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appDb)); } catch (err) {}
            try { await supabase.from('app_storage').upsert({ key: STORAGE_KEY, value: appDb }); } catch(err) {}
        }

        // دالة الطوارئ لضبط بيانات الإدارة فوراً
        function hardResetAdminCredentials() {
            loadLocalDb();
            appDb.adminUsername = 'raidalmelli';
            appDb.adminPassword = 'Haitham2007@';
            persistDb();
            showToast('تمت إعادة تعيين اسم المستخدم وكلمة المرور الافتراضية بنجاح!');
            document.getElementById('login-username').value = 'raidalmelli';
            document.getElementById('login-password').value = 'Haitham2007@';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-900/90 text-white border-rose-500' : 'bg-slate-900/95 text-amber-200 border-[#c5a059]';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check text-[#f5d78e]';

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border shadow-2xl text-xs font-bold pointer-events-auto transition-all duration-300 transform translate-y-4 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function checkSavedLogin() {
            loadLocalDb();
            try {
                const saved = localStorage.getItem(LOGIN_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && (parsed.role === 'admin' || parsed.role === 'staff')) {
                        currentUser = parsed.user;
                        applyUserSession();
                        return;
                    }
                }
            } catch (err) {}
            document.getElementById('modal-login').classList.remove('hidden');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const remember = document.getElementById('remember-me-checkbox').checked;

            loadLocalDb();

            if (u === 'raidalmelli' && p === 'Haitham2007@') {
                currentUser = 'admin';
                if (remember) localStorage.setItem(LOGIN_KEY, JSON.stringify({ role: 'admin', user: 'admin' }));
                else localStorage.removeItem(LOGIN_KEY);
                showToast('مرحباً بك مجدداً سيد رائد - صلاحيات الإدارة الكاملة');
                applyUserSession();
                return;
            }

            const staffMember = (appDb.staff || []).find(s => s.username === u && s.password === p);
            if (staffMember) {
                currentUser = staffMember;
                if (remember) localStorage.setItem(LOGIN_KEY, JSON.stringify({ role: 'staff', user: staffMember }));
                else localStorage.removeItem(LOGIN_KEY);
                showToast(`مرحباً بك ${staffMember.name}`);
                applyUserSession();
                return;
            }

            showToast('اسم المستخدم أو كلمة المرور غير صحيحة!', 'error');
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem(LOGIN_KEY);
            document.getElementById('modal-login').classList.remove('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            showToast('تم تسجيل الخروج بنجاح');
        }

        function applyUserSession() {
            document.getElementById('modal-login').classList.add('hidden');
            const badge = document.getElementById('user-role-badge');
            const nameLabel = document.getElementById('header-user-name');

            if (currentUser === 'admin') {
                badge.textContent = 'Admin';
                badge.className = 'text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-[#c5a059] text-black uppercase';
                nameLabel.textContent = 'المدير العام: رائد الملي';
            } else {
                badge.textContent = 'Staff';
                badge.className = 'text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-blue-500 text-white uppercase';
                nameLabel.textContent = currentUser ? currentUser.name : 'موظف';
            }
            navigateTo('dashboard');
        }

        function navigateTo(tab) {
            activeTab = tab;
            // التنقل بين الأقسام
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('ar');
            checkSavedLogin();
            syncCloudDb(); 
        });
    </script>
</body>
</html>

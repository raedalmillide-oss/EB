<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Bridges Sourcing & Logistics Co.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .luxury-gradient { background: linear-gradient(135deg, #09090b 0%, #17171c 50%, #0d0d10 100%); }
        .btn-gold { background: linear-gradient(135deg, #d8b262 0%, #b89142 100%); color: #08080a; font-weight: 800; }
        .btn-gold:hover { background: linear-gradient(135deg, #e4c276 0%, #c8a152 100%); }
        .modal-backdrop { background-color: rgba(8, 8, 10, 0.75); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <div id="toast-container" class="fixed bottom-6 left-6 z-[250] space-y-3 pointer-events-none"></div>

    <header class="luxury-gradient text-white border-b-2 border-[#c5a059] sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-black/60 border border-[#c5a059] flex items-center justify-center text-[#f5d78e]">
                    <i class="fa-solid fa-bridge text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-[#f5d78e]">Echo Bridges</h1>
                    <p class="text-[10px] text-slate-300">Sourcing & Logistics Co.</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-300">المدير: رائد الملي</span>
                <button onclick="openAdminModal()" class="bg-amber-500/20 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold"><i class="fa-solid fa-user-gear"></i></button>
            </div>
        </div>

        <nav class="bg-[#121216] border-t border-slate-800">
            <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto py-2">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#c5a059] text-black"><i class="fa-solid fa-chart-pie ml-1"></i> لوحة التحكم</button>
                <button onclick="switchTab('clients')" id="tab-clients" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white"><i class="fa-solid fa-users ml-1"></i> العملاء</button>
                <button onclick="switchTab('requests')" id="tab-requests" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white"><i class="fa-solid fa-clipboard-list ml-1"></i> طلبات التسعير</button>
                <button onclick="switchTab('suppliers')" id="tab-suppliers" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white"><i class="fa-solid fa-industry ml-1"></i> الموردين</button>
            </div>
        </nav>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <!-- Dashboard -->
        <section id="sec-dashboard" class="space-y-6">
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                    <span class="text-xs text-slate-500 block">العملاء</span>
                    <h3 class="text-2xl font-black" id="kpi-clients">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                    <span class="text-xs text-slate-500 block">الطلبات</span>
                    <h3 class="text-2xl font-black text-amber-600" id="kpi-requests">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                    <span class="text-xs text-slate-500 block">الموردين</span>
                    <h3 class="text-2xl font-black text-blue-600" id="kpi-suppliers">0</h3>
                </div>
            </div>
        </section>

        <!-- Clients -->
        <section id="sec-clients" class="space-y-4 hidden">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl border">
                <h2 class="font-black text-base">إدارة العملاء</h2>
                <button onclick="openModal('client')" class="btn-gold px-4 py-2 rounded-xl text-xs font-black">إضافة عميل</button>
            </div>
            <div class="bg-white rounded-2xl border p-4">
                <div id="clients-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- Requests -->
        <section id="sec-requests" class="space-y-4 hidden">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl border">
                <h2 class="font-black text-base">طلبات التسعير (RFQs)</h2>
                <button onclick="openModal('request')" class="btn-gold px-4 py-2 rounded-xl text-xs font-black">إنشاء طلب</button>
            </div>
            <div class="bg-white rounded-2xl border p-4">
                <div id="requests-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- Suppliers -->
        <section id="sec-suppliers" class="space-y-4 hidden">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl border">
                <h2 class="font-black text-base">دليل الموردين</h2>
                <button onclick="openModal('supplier')" class="btn-gold px-4 py-2 rounded-xl text-xs font-black">تسجيل مورد</button>
            </div>
            <div class="bg-white rounded-2xl border p-4">
                <div id="suppliers-list" class="space-y-2"></div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="modal-client" class="fixed inset-0 modal-backdrop z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
            <h3 class="font-black text-sm">إضافة عميل جديد</h3>
            <input type="text" id="inp-client-name" placeholder="اسم الشركة / العميل" class="w-full p-2 border rounded-xl text-xs">
            <input type="text" id="inp-client-phone" placeholder="رقم الهاتف" class="w-full p-2 border rounded-xl text-xs" dir="ltr">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('client')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">إلغاء</button>
                <button onclick="saveClient()" class="btn-gold px-4 py-2 rounded-xl text-xs">حفظ</button>
            </div>
        </div>
    </div>

    <div id="modal-request" class="fixed inset-0 modal-backdrop z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
            <h3 class="font-black text-sm">إنشاء طلب تسعير جديد</h3>
            <input type="text" id="inp-req-title" placeholder="عنوان الطلب / المنتج" class="w-full p-2 border rounded-xl text-xs">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('request')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">إلغاء</button>
                <button onclick="saveRequest()" class="btn-gold px-4 py-2 rounded-xl text-xs">حفظ</button>
            </div>
        </div>
    </div>

    <div id="modal-supplier" class="fixed inset-0 modal-backdrop z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
            <h3 class="font-black text-sm">تسجيل مورد جديد</h3>
            <input type="text" id="inp-sup-name" placeholder="اسم المصنع / المورد" class="w-full p-2 border rounded-xl text-xs">
            <input type="text" id="inp-sup-spec" placeholder="مجال الاختصاص" class="w-full p-2 border rounded-xl text-xs">
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('supplier')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">إلغاء</button>
                <button onclick="saveSupplier()" class="btn-gold px-4 py-2 rounded-xl text-xs">حفظ</button>
            </div>
        </div>
    </div>

    <div id="modal-admin" class="fixed inset-0 modal-backdrop z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3">
            <h3 class="font-black text-sm">إعدادات الحساب</h3>
            <p class="text-xs text-slate-500">أنت مسجل الدخول بصلاحيات المدير العام (Admin).</p>
            <div class="flex justify-end pt-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'EB_LOGISTICS_DB_V18';
        const SUPABASE_URL = 'https://zkzpxaqffrctjhfgkpnm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xi7Owac1858P4KUmIt-YCw_wWcy2XyC';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let db = { clients: [], requests: [], suppliers: [] };

        function loadData() {
            try {
                const local = localStorage.getItem(STORAGE_KEY);
                if (local) db = JSON.parse(local);
            } catch(e) {}
            refreshUI();
        }

        async function syncCloud() {
            try {
                const { data } = await supabase.from('app_storage').select('value').eq('key', STORAGE_KEY).single();
                if (data && data.value) {
                    db = data.value;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                    refreshUI();
                }
            } catch(e) {}
        }

        async function saveData() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
            try { await supabase.from('app_storage').upsert({ key: STORAGE_KEY, value: db }); } catch(e) {}
            refreshUI();
            showToast('تم الحفظ بنجاح');
        }

        function showToast(msg) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'px-4 py-2 bg-slate-900 text-amber-200 rounded-xl text-xs font-bold border border-[#c5a059] shadow-lg';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function switchTab(tab) {
            ['dashboard', 'clients', 'requests', 'suppliers'].forEach(id => {
                document.getElementById(`sec-${id}`).classList.toggle('hidden', id !== tab);
                const btn = document.getElementById(`tab-${id}`);
                if (btn) {
                    btn.className = (id === tab) 
                        ? 'px-4 py-2 rounded-xl text-xs font-bold bg-[#c5a059] text-black' 
                        : 'px-4 py-2 rounded-xl text-xs font-bold text-slate-300 hover:text-white';
                }
            });
        }

        function refreshUI() {
            document.getElementById('kpi-clients').textContent = db.clients.length;
            document.getElementById('kpi-requests').textContent = db.requests.length;
            document.getElementById('kpi-suppliers').textContent = db.suppliers.length;

            document.getElementById('clients-list').innerHTML = db.clients.map(c => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-xs font-bold">
                    <span>${c.name} (${c.phone || '-'})</span>
                    <button onclick="deleteItem('clients', '${c.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">لا توجد بيانات.</p>';

            document.getElementById('requests-list').innerHTML = db.requests.map(r => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-xs font-bold">
                    <span>${r.title}</span>
                    <button onclick="deleteItem('requests', '${r.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">لا توجد طلبات.</p>';

            document.getElementById('suppliers-list').innerHTML = db.suppliers.map(s => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-xs font-bold">
                    <span>${s.name} - ${s.spec}</span>
                    <button onclick="deleteItem('suppliers', '${s.id}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('') || '<p class="text-xs text-slate-400">لا توجد موردين.</p>';
        }

        function openModal(name) { document.getElementById(`modal-${name}`).classList.remove('hidden'); document.getElementById(`modal-${name}`).classList.add('flex'); }
        function closeModal(name) { document.getElementById(`modal-${name}`).classList.add('hidden'); document.getElementById(`modal-${name}`).classList.remove('flex'); }
        function openAdminModal() { document.getElementById('modal-admin').classList.remove('hidden'); document.getElementById('modal-admin').classList.add('flex'); }
        function closeAdminModal() { document.getElementById('modal-admin').classList.add('hidden'); document.getElementById('modal-admin').classList.remove('flex'); }

        function saveClient() {
            const name = document.getElementById('inp-client-name').value.trim();
            if(!name) return;
            db.clients.push({ id: Date.now().toString(), name, phone: document.getElementById('inp-client-phone').value });
            closeModal('client');
            saveData();
        }

        function saveRequest() {
            const title = document.getElementById('inp-req-title').value.trim();
            if(!title) return;
            db.requests.push({ id: Date.now().toString(), title });
            closeModal('request');
            saveData();
        }

        function saveSupplier() {
            const name = document.getElementById('inp-sup-name').value.trim();
            if(!name) return;
            db.suppliers.push({ id: Date.now().toString(), name, spec: document.getElementById('inp-sup-spec').value });
            closeModal('supplier');
            saveData();
        }

        function deleteItem(type, id) {
            db[type] = db[type].filter(x => x.id !== id);
            saveData();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            syncCloud();
        });
    </script>
</body>
</html>

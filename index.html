<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Bridges Sourcing & Logistics Co.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --eb-black-dark: #08080a;
            --eb-black-card: #131317;
            --eb-gold-main: #c5a059;
            --eb-gold-light: #f5d78e;
            --eb-gold-dark: #987838;
        }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .luxury-gradient {
            background: linear-gradient(135deg, #09090b 0%, #17171c 50%, #0d0d10 100%);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d8b262 0%, #b89142 100%);
            color: #08080a;
            font-weight: 800;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #e4c276 0%, #c8a152 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-backdrop {
            background-color: rgba(8, 8, 10, 0.75);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased select-none">

    <div id="toast-container" class="fixed bottom-6 left-6 z-[250] space-y-3 pointer-events-none"></div>

    <header class="luxury-gradient text-white border-b-2 border-[#c5a059] sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3.5 cursor-pointer" onclick="navigateTo('dashboard')">
                <div class="w-12 h-12 rounded-2xl bg-black/60 border border-[#c5a059]/60 flex items-center justify-center text-[#f5d78e] shadow-md shadow-amber-950/20">
                    <i class="fa-solid fa-bridge text-2xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-[#f5d78e] font-serif">Echo Bridges</h1>
                        <span id="user-role-badge" class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-[#c5a059] text-black uppercase tracking-wider">Admin</span>
                    </div>
                    <p class="text-xs text-slate-300 font-medium tracking-wide">Sourcing & Logistics Co.</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex bg-black/50 border border-[#c5a059]/40 rounded-xl p-1 text-xs font-bold">
                    <button type="button" onclick="setLanguage('ar')" id="lang-btn-ar" class="px-2.5 py-1 rounded-lg transition bg-[#c5a059] text-black font-black shadow-sm">عربي</button>
                    <button type="button" onclick="setLanguage('en')" id="lang-btn-en" class="px-2.5 py-1 rounded-lg transition text-slate-300 hover:text-white">EN</button>
                    <button type="button" onclick="setLanguage('zh')" id="lang-btn-zh" class="px-2.5 py-1 rounded-lg transition text-slate-300 hover:text-white">中文</button>
                </div>

                <div class="flex items-center gap-2">
                    <span id="header-user-name" class="text-xs font-bold text-slate-300 hidden sm:inline-block">المدير العام: رائد الملي</span>
                    <button type="button" onclick="openAdminSettingsModal()" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="تعديل حسابي">
                        <i class="fa-solid fa-user-gear"></i>
                    </button>
                    <button type="button" onclick="handleLogout()" class="bg-rose-500/20 hover:bg-rose-600 hover:text-white text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5" title="تسجيل الخروج">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>

        <nav class="bg-[#121216] border-t border-slate-800">
            <div class="max-w-7xl mx-auto px-4 flex items-center gap-1.5 overflow-x-auto py-2 custom-scrollbar">
                <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap bg-[#c5a059] text-black shadow-md">
                    <i class="fa-solid fa-chart-pie"></i> <span id="t-nav-dashboard">لوحة التحكم</span>
                </button>
                <button onclick="navigateTo('clients')" id="nav-clients" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-users"></i> <span id="t-nav-clients">إدارة العملاء</span>
                </button>
                <button onclick="navigateTo('requests')" id="nav-requests" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-clipboard-list"></i> <span id="t-nav-requests">طلب التسعير</span>
                </button>
                <button onclick="navigateTo('inspections')" id="nav-inspections" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-clipboard-check"></i> <span id="t-nav-inspections">الفحص</span>
                </button>
                <button onclick="navigateTo('shipping')" id="nav-shipping" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-ship"></i> <span id="t-nav-shipping">الشحن</span>
                </button>
                <button onclick="navigateTo('suppliers')" id="nav-suppliers" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-industry"></i> <span id="t-nav-suppliers">دليل الموردين</span>
                </button>
                <button onclick="navigateTo('accounting')" id="nav-accounting" class="nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white">
                    <i class="fa-solid fa-chart-line"></i> <span id="t-nav-accounting">التحليل المالي</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
        <section id="view-dashboard" class="space-y-6 hidden">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 block mb-1" id="t-kpi-clients">إجمالي العملاء</span>
                    <h3 class="text-3xl font-black text-slate-900" id="dash-clients-count">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 block mb-1" id="t-kpi-active-reqs">طلبات قيد العمل</span>
                    <h3 class="text-3xl font-black text-amber-600" id="dash-active-reqs-count">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 block mb-1" id="t-kpi-suppliers">دليل الموردين</span>
                    <h3 class="text-3xl font-black text-blue-600" id="dash-suppliers-count">0</h3>
                </div>
                <div id="dash-profit-card" class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 block mb-1" id="t-kpi-profit">الأرباح المتوقعة</span>
                    <h3 class="text-3xl font-black text-emerald-600 font-mono" id="dash-profit-sum">$0</h3>
                </div>
            </div>

            <div id="admin-settings-section" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- قسم أسعار الصرف العالمية المباشرة -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-globe text-amber-600 text-lg"></i>
                            <h3 class="font-black text-slate-900 text-base" id="t-exchange-title">أسعار الصرف المباشرة</h3>
                        </div>
                        <span id="rate-last-update-time" class="text-[10px] text-slate-400 font-mono">تحديث حي</span>
                    </div>
                    <div class="space-y-2.5 text-xs">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" id="t-rate-1">1 دولار ($ USD) كم يساوي رنمينبي صيني (¥ RMB):</label>
                            <input type="number" step="0.0001" id="rate-usd-cny" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-amber-900" placeholder="7.23">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1" id="t-rate-2">1 يورو (€ EUR) كم يساوي دولار ($ USD):</label>
                            <input type="number" step="0.0001" id="rate-eur-usd" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono font-bold text-blue-900" placeholder="1.08">
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button type="button" onclick="fetchLiveExchangeRates()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-rotate"></i> تحديث حي
                            </button>
                            <button type="button" onclick="saveExchangeRates()" class="bg-[#c5a059] hover:bg-[#b89142] text-black font-black py-2 rounded-xl transition shadow-sm">
                                <i class="fa-solid fa-check"></i> حفظ الريت
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                    <div class="flex items-center gap-2.5 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-envelope text-amber-600 text-lg"></i>
                        <h3 class="font-black text-slate-900 text-base" id="t-email-config">إعدادات البريد</h3>
                    </div>
                    <form onsubmit="saveCompanyEmailSettings(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني الرسمي للشركة:</label>
                            <input type="email" id="setting-company-email" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium">
                        </div>
                        <div class="flex justify-end pt-4">
                            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-[#f5d78e] px-4 py-2 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- باقي الأقسام -->
        <section id="view-clients" class="space-y-6 hidden"></section>
        <section id="view-client-profile" class="space-y-6 hidden"></section>
        <section id="view-requests" class="space-y-6 hidden"></section>
        <section id="view-inspections" class="space-y-6 hidden"></section>
        <section id="view-shipping" class="space-y-6 hidden"></section>
        <section id="view-suppliers" class="space-y-6 hidden"></section>
        <section id="view-accounting" class="space-y-6 hidden"></section>
    </main>

    <!-- نافذة تسجيل الدخول للمدير -->
    <div id="modal-login" class="fixed inset-0 modal-backdrop z-[200] flex items-center justify-center p-4">
        <div class="luxury-gradient border border-[#c5a059]/40 rounded-3xl max-w-md w-full p-8 shadow-2xl text-white space-y-6">
            <div class="text-center space-y-2">
                <div class="mx-auto w-16 h-16 rounded-2xl bg-black/60 border border-[#c5a059]/40 text-[#f5d78e] flex items-center justify-center text-3xl mb-1 shadow-lg">
                    <i class="fa-solid fa-bridge"></i>
                </div>
                <h2 class="text-2xl font-black text-[#f5d78e] font-serif">Echo Bridges</h2>
                <p class="text-xs text-slate-400 font-medium">تسجيل الدخول إلى لوحة الإدارة</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">اسم المستخدم:</label>
                    <input type="text" id="login-username" required class="w-full p-3 bg-black/50 border border-slate-700 rounded-xl text-sm text-white focus:border-[#c5a059] outline-none" value="admin" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور:</label>
                    <input type="password" id="login-password" required class="w-full p-3 bg-black/50 border border-slate-700 rounded-xl text-sm text-white focus:border-[#c5a059] outline-none" placeholder="123456" dir="ltr">
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-300">
                        <input type="checkbox" id="remember-admin-checkbox" checked class="w-4 h-4 rounded text-[#c5a059] focus:ring-0">
                        <span>تذكرني على هذا الجهاز</span>
                    </label>
                </div>

                <button type="submit" class="w-full btn-gold py-3.5 rounded-xl text-sm font-black shadow-xl transition">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة تعديل بيانات الحساب لاحقاً -->
    <div id="modal-admin-settings" class="fixed inset-0 modal-backdrop z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-black text-slate-900 text-base">تعديل اسم المستخدم وكلمة المرور</h3>
                <button type="button" onclick="closeAdminSettingsModal()" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveAdminCredentials(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">اسم المستخدم الجديد:</label>
                    <input type="text" id="admin-new-user" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" dir="ltr">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">كلمة المرور الجديدة:</label>
                    <input type="text" id="admin-new-pass" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" dir="ltr">
                </div>
                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeAdminSettingsModal()" class="px-4 py-2 bg-slate-100 text-slate-700 font-bold rounded-xl">إلغاء</button>
                    <button type="submit" class="btn-gold px-5 py-2 rounded-xl font-black">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'EB_LOGISTICS_DB_V_PERFECT';
        const LOGIN_KEY = 'EB_ADMIN_SESSION';

        // Supabase configuration
        const SUPABASE_URL = 'https://zkzpxaqffrctjhfgkpnm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Xi7Owac1858P4KUmIt-YCw_wWcy2XyC';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentLang = 'ar';
        let currentUser = null;
        let activeTab = 'dashboard';
        let appDb = null;

        // كلمة المرور الجديدة السهلة
        const defaultDatabase = {
            companyEmail: 'info@echobridges.com',
            adminUsername: 'admin',
            adminPassword: '123456',
            exchangeRates: { usdToCny: 7.23, eurToUsd: 1.08, lastUpdate: 'تلقائي' },
            clients: [],
            suppliers: [],
            requests: [],
            inspections: [],
            shipping: []
        };

        function setLanguage(lang) {
            currentLang = lang || 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
        }

        function loadLocalDb() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) appDb = JSON.parse(stored);
            } catch(e) {}
            
            if (!appDb) appDb = JSON.parse(JSON.stringify(defaultDatabase));
            if (!appDb.adminUsername) appDb.adminUsername = 'admin';
            if (!appDb.adminPassword) appDb.adminPassword = '123456';
        }

        async function syncCloudDb() {
            try {
                const { data } = await sbClient
                    .from('app_storage')
                    .select('value')
                    .eq('key', STORAGE_KEY)
                    .single();

                if (data && data.value) {
                    appDb = data.value;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appDb)); 
                }
            } catch (err) {}
        }

        async function persistDb() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appDb)); } catch (err) {}
            try { await sbClient.from('app_storage').upsert({ key: STORAGE_KEY, value: appDb }); } catch(err) {}
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-900/90 text-white border-rose-500' : 'bg-slate-900/95 text-amber-200 border-[#c5a059]';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check text-[#f5d78e]';

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-2xl border shadow-2xl text-xs font-bold pointer-events-auto transition-all duration-300 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 3500);
        }

        // دالة الدخول الصريحة للمدير
        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const remember = document.getElementById('remember-admin-checkbox').checked;

            // قبول مباشر وصريح للبيانات الافتراضية
            if ((u === 'admin' && p === '123456') || 
                (appDb && u === appDb.adminUsername && p === appDb.adminPassword)) {
                
                currentUser = 'admin';
                if (!appDb) appDb = defaultDatabase;
                appDb.adminUsername = 'admin';
                appDb.adminPassword = '123456';
                persistDb();

                if (remember) {
                    localStorage.setItem(LOGIN_KEY, 'true');
                } else {
                    localStorage.removeItem(LOGIN_KEY);
                }

                document.getElementById('modal-login').classList.add('hidden');
                showToast('تم تسجيل الدخول بنجاح');
                navigateTo('dashboard');
            } else {
                showToast('اسم المستخدم أو كلمة المرور غير صحيحة!', 'error');
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem(LOGIN_KEY);
            document.getElementById('modal-login').classList.remove('hidden');
            showToast('تم تسجيل الخروج');
        }

        function checkAdminAccess() {
            const isSaved = localStorage.getItem(LOGIN_KEY);
            if (isSaved === 'true') {
                currentUser = 'admin';
                document.getElementById('modal-login').classList.add('hidden');
                navigateTo('dashboard');
            } else {
                currentUser = null;
                document.getElementById('modal-login').classList.remove('hidden');
            }
        }

        // جلب أسعار الصرف الحية
        async function fetchLiveExchangeRates() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();

                if (data && data.rates && data.rates.CNY) {
                    const usdToCny = parseFloat(data.rates.CNY.toFixed(4));
                    const eurToUsd = parseFloat((1 / data.rates.EUR).toFixed(4));

                    if (!appDb.exchangeRates) appDb.exchangeRates = {};
                    appDb.exchangeRates.usdToCny = usdToCny;
                    appDb.exchangeRates.eurToUsd = eurToUsd;
                    appDb.exchangeRates.lastUpdate = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                    const cnyInput = document.getElementById('rate-usd-cny');
                    const eurInput = document.getElementById('rate-eur-usd');
                    if (cnyInput) cnyInput.value = usdToCny;
                    if (eurInput) eurInput.value = eurToUsd;

                    const timeLabel = document.getElementById('rate-last-update-time');
                    if (timeLabel) timeLabel.textContent = `محدث: ${appDb.exchangeRates.lastUpdate}`;

                    persistDb();
                    showToast(`تم تحديث الريت الحي: 1$ = ¥${usdToCny}`);
                }
            } catch (err) {}
        }

        function saveExchangeRates() {
            const usdCny = parseFloat(document.getElementById('rate-usd-cny')?.value || 7.23);
            const eurUsd = parseFloat(document.getElementById('rate-eur-usd')?.value || 1.08);
            if (!appDb.exchangeRates) appDb.exchangeRates = {};
            appDb.exchangeRates.usdToCny = usdCny;
            appDb.exchangeRates.eurToUsd = eurUsd;
            persistDb();
            showToast('تم حفظ أسعار الصرف');
        }

        function navigateTo(tab) {
            activeTab = tab;
            ['dashboard', 'clients', 'requests', 'inspections', 'shipping', 'suppliers', 'accounting'].forEach(id => {
                const el = document.getElementById(`view-${id}`);
                const btn = document.getElementById(`nav-${id}`);
                if (el) el.classList.toggle('hidden', id !== tab);
                if (btn) {
                    btn.className = (id === tab) 
                        ? 'nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap bg-[#c5a059] text-black shadow-md'
                        : 'nav-item px-3.5 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2 whitespace-nowrap text-slate-300 hover:text-white';
                }
            });
            renderDashboardView();
        }

        function renderDashboardView() {
            document.getElementById('dash-clients-count').textContent = (appDb.clients || []).length;
            document.getElementById('dash-active-reqs-count').textContent = (appDb.requests || []).length;
            document.getElementById('dash-suppliers-count').textContent = (appDb.suppliers || []).length;

            const rates = appDb.exchangeRates || { usdToCny: 7.23, eurToUsd: 1.08 };
            const cnyInput = document.getElementById('rate-usd-cny');
            const eurInput = document.getElementById('rate-eur-usd');
            if (cnyInput) cnyInput.value = rates.usdToCny;
            if (eurInput) eurInput.value = rates.eurToUsd;
        }

        function openAdminSettingsModal() {
            document.getElementById('modal-admin-settings').classList.remove('hidden');
            document.getElementById('modal-admin-settings').classList.add('flex');
            document.getElementById('admin-new-user').value = appDb.adminUsername || 'admin';
            document.getElementById('admin-new-pass').value = appDb.adminPassword || '123456';
        }

        function closeAdminSettingsModal() {
            document.getElementById('modal-admin-settings').classList.add('hidden');
            document.getElementById('modal-admin-settings').classList.remove('flex');
        }

        function saveAdminCredentials(e) {
            e.preventDefault();
            appDb.adminUsername = document.getElementById('admin-new-user').value.trim();
            appDb.adminPassword = document.getElementById('admin-new-pass').value.trim();
            persistDb();
            closeAdminSettingsModal();
            showToast('تم تحديث بيانات الدخول بنجاح');
        }

        function saveCompanyEmailSettings(e) {
            e.preventDefault();
            appDb.companyEmail = document.getElementById('setting-company-email').value.trim();
            persistDb();
            showToast('تم حفظ البريد الإلكتروني');
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalDb();
            setLanguage('ar');
            checkAdminAccess();
            syncCloudDb();
            fetchLiveExchangeRates();
        });
    </script>
</body>
</html>
